<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Voice Karaoke</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #090a0f;
            --neon-blue: #00f3ff;
            --neon-pink: #ff00ea;
            --text-light: #e0e0e0;
            --panel-bg: rgba(20, 20, 30, 0.8);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #090a0f 100%);
        }

        .container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: center;
        }

        .screen {
            width: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.6s ease-out;
        }

        .screen.active {
            display: flex;
        }

        /* Títulos Neón */
        h1.title {
            font-size: 4rem;
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--neon-blue), 0 0 20px var(--neon-blue), 0 0 40px var(--neon-pink);
            margin-bottom: 10px;
            text-align: center;
        }
        
        .subtitle {
            color: var(--neon-blue);
            margin-bottom: 40px;
            text-align: center;
            font-weight: 400;
        }

        /* Formularios */
        .input-box {
            background: var(--panel-bg);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(0, 243, 255, 0.2);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.1);
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            backdrop-filter: blur(10px);
        }

        input {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #2a2a35;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            font-size: 1.1rem;
            outline: none;
            transition: all 0.3s;
        }

        input:focus {
            border-color: var(--neon-pink);
            box-shadow: 0 0 15px rgba(255, 0, 234, 0.4);
        }

        button {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
            color: #fff;
        }

        .btn-start {
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-pink));
            box-shadow: 0 0 20px rgba(255, 0, 234, 0.5);
            margin-top: 10px;
        }

        .btn-start:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.8);
        }

        .btn-stop {
            background: transparent;
            border: 2px solid #ff003c;
            color: #ff003c;
            box-shadow: 0 0 10px rgba(255, 0, 60, 0.3);
            margin-top: 20px;
        }

        .btn-stop:hover {
            background: #ff003c;
            color: white;
            box-shadow: 0 0 30px #ff003c;
        }

        .helper-text { font-size: 0.85rem; color: #888; margin-top: -10px; }

        /* Karaoke Layout */
        .dashboard {
            width: 100%;
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        @media (max-width: 900px) {
            .dashboard { grid-template-columns: 1fr; }
        }

        .panel {
            background: var(--panel-bg);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
        }

        .video-wrapper {
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            border: 1px solid var(--neon-blue);
        }

        #youtube-player { width: 100%; height: 100%; }

        /* Letras y Feedback de Voz */
        .lyrics-box {
            height: 350px;
            overflow-y: auto;
            text-align: center;
            font-size: 1.2rem;
            line-height: 1.8;
            padding: 10px;
            white-space: pre-wrap;
            color: #ccc;
        }

        .lyrics-box::-webkit-scrollbar { width: 6px; }
        .lyrics-box::-webkit-scrollbar-thumb { background: var(--neon-pink); border-radius: 3px; }

        .voice-feedback {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0,0,0,0.5);
            border-radius: 10px;
            border-left: 4px solid var(--neon-blue);
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--neon-blue);
            text-shadow: 0 0 5px var(--neon-blue);
        }

        /* Marcador */
        .score-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 10px 20px;
            background: rgba(0,0,0,0.6);
            border-radius: 15px;
            margin-bottom: 20px;
            border: 1px solid var(--neon-pink);
        }

        .score-title { font-size: 1.5rem; color: #fff; }
        .score-number {
            font-size: 3rem;
            font-weight: 900;
            color: var(--neon-pink);
            text-shadow: 0 0 20px var(--neon-pink);
            transition: transform 0.2s;
        }

        .status-msg { margin-top: 15px; color: #ffeb3b; text-align: center; height: 20px; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .matched-word {
            color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue);
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- PANTALLA DE INICIO -->
        <div id="home-screen" class="screen active">
            <h1 class="title">Neon Voice</h1>
            <p class="subtitle">Karaoke con Inteligencia de Reconocimiento de Voz</p>

            <div class="input-box">
                <div>
                    <input type="text" id="url-input" placeholder="URL de YouTube (Obligatorio)*">
                    <p class="helper-text">Ej: https://www.youtube.com/watch?v=...</p>
                </div>
                
                <div>
                    <input type="text" id="artist-input" placeholder="Nombre del Artista (Opcional)">
                </div>
                
                <div>
                    <input type="text" id="song-input" placeholder="Nombre de la Canción (Opcional)">
                    <p class="helper-text">El artista y canción sirven para descargar la letra oficial.</p>
                </div>

                <button id="start-btn" class="btn-start">🎤 Iniciar Karaoke</button>
                <div id="setup-msg" class="status-msg"></div>
            </div>
        </div>

        <!-- PANTALLA DE KARAOKE -->
        <div id="karaoke-screen" class="screen">
            
            <div class="score-container">
                <div class="score-title">TU PUNTUACIÓN:</div>
                <div class="score-number" id="score-display">0</div>
            </div>

            <div class="dashboard">
                <!-- Izquierda: Video y Micrófono -->
                <div class="panel">
                    <div class="video-wrapper">
                        <div id="youtube-player"></div>
                    </div>
                    
                    <div class="voice-feedback" id="voice-feedback">
                        Esperando que cantes... 🎙️
                    </div>
                </div>

                <!-- Derecha: Letras -->
                <div class="panel">
                    <h3 style="text-align: center; color: var(--neon-pink); margin-bottom: 15px;" id="lyrics-title">Letra de la Canción</h3>
                    <div class="lyrics-box" id="lyrics-box">
                        Si ingresaste el Artista y Canción, la letra aparecerá aquí...
                    </div>
                </div>
            </div>

            <button id="stop-btn" class="btn-stop">Terminar Presentación</button>
        </div>

    </div>

    <!-- Script de la API de YouTube -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <!-- Lógica Principal -->
    <script>
        // --- VARIABLES GLOBALES ---
        let player;
        let recognition;
        let score = 0;
        let isPlaying = false;
        let lyricsWordsSet = new Set(); // Guardará las palabras de la letra para comparar

        // --- ELEMENTOS DEL DOM ---
        const homeScreen = document.getElementById('home-screen');
        const karaokeScreen = document.getElementById('karaoke-screen');
        const urlInput = document.getElementById('url-input');
        const artistInput = document.getElementById('artist-input');
        const songInput = document.getElementById('song-input');
        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');
        const scoreDisplay = document.getElementById('score-display');
        const voiceFeedback = document.getElementById('voice-feedback');
        const lyricsBox = document.getElementById('lyrics-box');
        const lyricsTitle = document.getElementById('lyrics-title');
        const setupMsg = document.getElementById('setup-msg');

        // --- 1. UTILIDADES Y NORMALIZACIÓN ---
        function extractVideoID(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        // Limpia el texto para compararlo exactamente (sin tildes, sin puntuación, minúsculas)
        function normalizeText(text) {
            return text.toLowerCase()
                       .normalize("NFD").replace(/[\u0300-\u036f]/g, "") // Quitar tildes
                       .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()'"?¿¡!]/g,"") // Quitar puntuación
                       .trim();
        }

        // --- 2. YOUTUBE API ---
        function onYouTubeIframeAPIReady() {
            console.log("YT API lista");
        }

        function initYouTube(videoId) {
            if (player) {
                player.loadVideoById(videoId);
            } else {
                player = new YT.Player('youtube-player', {
                    videoId: videoId,
                    playerVars: { 'autoplay': 1, 'controls': 1 },
                    events: { 'onStateChange': onPlayerStateChange }
                });
            }
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                if (!isPlaying) startRecognition();
            } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
                stopRecognition();
            }
        }

        // --- 3. RECONOCIMIENTO DE VOZ (Speech Recognition) ---
        function setupSpeechRecognition() {
            // Verificar soporte
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                alert("Tu navegador no soporta el reconocimiento de voz. Por favor usa Google Chrome o Edge.");
                return false;
            }

            recognition = new SpeechRecognition();
            recognition.continuous = true;       // Escuchar continuamente
            recognition.interimResults = true;   // Mostrar resultados parciales
            recognition.lang = 'es-ES';          // Idioma principal español

            recognition.onstart = function() {
                isPlaying = true;
                voiceFeedback.innerHTML = "Escuchando... 🎙️";
                voiceFeedback.style.color = "var(--neon-pink)";
            };

            recognition.onresult = function(event) {
                let interimTranscript = '';
                let finalTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                        // Calcular puntuación solo con resultados finales para no duplicar puntos
                        evaluateSpeech(event.results[i][0].transcript);
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }

                // Actualizar interfaz visual de lo que dice el usuario
                if (interimTranscript !== '') {
                    voiceFeedback.innerHTML = interimTranscript;
                } else if (finalTranscript !== '') {
                    voiceFeedback.innerHTML = finalTranscript;
                    setTimeout(() => { if(isPlaying) voiceFeedback.innerHTML = "Escuchando... 🎙️"; }, 2000);
                }
            };

            recognition.onerror = function(event) {
                console.error("Error de voz: ", event.error);
                if (event.error === 'not-allowed') {
                    alert("Debes permitir el uso del micrófono.");
                }
            };

            recognition.onend = function() {
                // Si la canción sigue sonando pero el micrófono se apagó solo (comportamiento de Chrome), lo reiniciamos
                if (isPlaying && player && player.getPlayerState() === YT.PlayerState.PLAYING) {
                    recognition.start();
                }
            };

            return true;
        }

        function startRecognition() {
            if (recognition && !isPlaying) {
                try { recognition.start(); } catch(e){}
            }
        }

        function stopRecognition() {
            isPlaying = false;
            if (recognition) {
                recognition.stop();
                voiceFeedback.innerHTML = "Pausado ⏸️";
                voiceFeedback.style.color = "var(--text-light)";
            }
        }

        // --- 4. LÓGICA DE PUNTUACIÓN Y LETRAS ---
        async function fetchLyrics(artist, song) {
            lyricsWordsSet.clear();
            
            if (!artist || !song) {
                lyricsTitle.innerText = "Modo Libre";
                lyricsBox.innerHTML = "No se ingresó artista o canción.<br>El sistema evaluará tu voz, pero obtendrás más precisión si buscas la letra oficial.";
                return;
            }

            lyricsTitle.innerText = `${song} - ${artist}`;
            lyricsBox.innerHTML = "Buscando letra oficial...";

            try {
                const res = await fetch(`https://api.lyrics.ovh/v1/${encodeURIComponent(artist)}/${encodeURIComponent(song)}`);
                const data = await res.json();

                if (data.lyrics) {
                    const cleanLyrics = data.lyrics.replace(/\n\n\n/g, '\n\n');
                    lyricsBox.innerText = cleanLyrics;
                    
                    // Procesar las palabras para el comparador de voz
                    const normalizedLyrics = normalizeText(cleanLyrics);
                    const wordsArray = normalizedLyrics.split(/\s+/);
                    
                    // Guardar solo palabras de más de 3 letras para descartar conectores comunes (el, la, y, de)
                    wordsArray.forEach(word => {
                        if (word.length > 3) lyricsWordsSet.add(word);
                    });
                    
                } else {
                    throw new Error("No encontrada");
                }
            } catch (err) {
                lyricsBox.innerHTML = "No se encontró la letra exacta en la base de datos.<br><br>¡Canta con el alma! El sistema seguirá puntuando tu fluidez vocal.";
            }
        }

        function evaluateSpeech(spokenText) {
            const spokenWords = normalizeText(spokenText).split(/\s+/);
            let matchCount = 0;

            spokenWords.forEach(word => {
                // Si la palabra hablada está en la letra oficial, damos 50 puntos
                if (word.length > 3 && lyricsWordsSet.has(word)) {
                    matchCount++;
                    score += 50;
                } 
                // Si no hay letra oficial, damos puntos genéricos por cantar (fluidez)
                else if (lyricsWordsSet.size === 0 && word.length > 2) {
                    score += 10;
                }
            });

            if (matchCount > 0 || lyricsWordsSet.size === 0) {
                updateScoreAnim();
            }
        }

        function updateScoreAnim() {
            scoreDisplay.innerText = score;
            scoreDisplay.style.transform = 'scale(1.3)';
            scoreDisplay.style.color = '#fff';
            
            setTimeout(() => {
                scoreDisplay.style.transform = 'scale(1)';
                scoreDisplay.style.color = 'var(--neon-pink)';
            }, 150);
        }

        // --- 5. FLUJO DE BOTONES ---
        startBtn.addEventListener('click', async () => {
            const url = urlInput.value.trim();
            const artist = artistInput.value.trim();
            const song = songInput.value.trim();
            const videoId = extractVideoID(url);

            if (!videoId) {
                setupMsg.innerText = "❌ Por favor, ingresa una URL de YouTube válida.";
                return;
            }

            setupMsg.innerText = "Preparando micrófono...";
            
            // Pedir permisos de micro antes de iniciar
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                // Soltamos el stream, solo queríamos el permiso para que SpeechRecognition no falle
                stream.getTracks().forEach(track => track.stop());
                
                if (!setupSpeechRecognition()) return;

                // Transición de pantallas
                homeScreen.classList.remove('active');
                karaokeScreen.classList.add('active');
                
                score = 0;
                scoreDisplay.innerText = score;
                
                initYouTube(videoId);
                fetchLyrics(artist, song);

            } catch (err) {
                setupMsg.innerText = "❌ Necesitas dar permisos de micrófono para cantar.";
            }
        });

        stopBtn.addEventListener('click', () => {
            stopRecognition();
            if (player && typeof player.stopVideo === 'function') {
                player.stopVideo();
            }
            alert(`¡Presentación terminada!\n🎤 Puntuación final: ${score} puntos`);
            
            karaokeScreen.classList.remove('active');
            homeScreen.classList.add('active');
            setupMsg.innerText = "";
        });

    </script>
</body>
</html>
