<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Voice Pro - Immersive Karaoke</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #050505;
            --neon-blue: #00e5ff;
            --neon-pink: #ff007f;
            --gold: #ffd700;
            --text-muted: rgba(255, 255, 255, 0.4);
            --text-light: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); height: 100vh; overflow: hidden; }

        .screen {
            width: 100vw; height: 100vh; position: absolute; top: 0; left: 0;
            display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 10;
        }
        .screen.active { display: flex; animation: fadeIn 0.5s ease-out; }

        /* --- PANTALLA INICIO --- */
        #home-screen { background: radial-gradient(circle at 50% 50%, #151520 0%, #050505 100%); }
        .title {
            font-size: 5rem; font-weight: 900; text-transform: uppercase;
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-pink));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(0, 229, 255, 0.4)); margin-bottom: 30px; text-align: center;
        }

        .input-box {
            background: rgba(20, 20, 30, 0.6); backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 20px;
            padding: 40px; width: 100%; max-width: 600px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.05);
        }
        
        .input-group { position: relative; margin-bottom: 20px; }
        input {
            width: 100%; padding: 20px; border-radius: 12px; border: 2px solid transparent;
            background: rgba(0, 0, 0, 0.5); color: white; font-size: 1.2rem; outline: none; transition: all 0.3s;
        }
        input:focus { border-color: var(--neon-blue); box-shadow: 0 0 20px rgba(0, 229, 255, 0.2); }
        
        .btn-start {
            width: 100%; padding: 20px; border: none; border-radius: 12px; font-size: 1.3rem;
            font-weight: 900; text-transform: uppercase; cursor: pointer; color: #fff;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-pink));
            box-shadow: 0 10px 30px rgba(255, 0, 127, 0.4); transition: transform 0.2s;
        }
        .btn-start:hover { transform: scale(1.02); }
        .status-msg { margin-top: 20px; text-align: center; color: var(--neon-blue); font-weight: 700; min-height: 20px; font-size: 0.9rem;}

        /* --- KARAOKE UI --- */
        .video-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; pointer-events: none; background: #000; }
        .video-bg iframe {
            width: 100vw; height: 56.25vw; min-height: 100vh; min-width: 177.77vh;
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); opacity: 0.4;
        }
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.9) 100%); z-index: 2;
        }

        .karaoke-container { position: relative; z-index: 3; width: 100%; height: 100%; display: flex; flex-direction: column; }

        /* Barra Superior y Monitor de Voz */
        .top-bar { display: flex; justify-content: space-between; align-items: flex-start; padding: 20px 40px; height: 120px; }
        
        .score-board {
            background: rgba(0,0,0,0.7); padding: 10px 25px; border-radius: 20px; border: 2px solid var(--neon-pink);
            text-align: center; backdrop-filter: blur(10px); display: flex; flex-direction: column; justify-content: center;
        }
        .score-title { font-size: 0.8rem; color: #aaa; letter-spacing: 2px; }
        .score-number { font-size: 2.5rem; font-weight: 900; color: var(--neon-pink); text-shadow: 0 0 15px var(--neon-pink); }

        .voice-monitor-container { position: relative; }
        .btn-toggle-voice {
            background: rgba(0,0,0,0.7); border: 2px solid var(--neon-blue); color: var(--neon-blue);
            padding: 10px 20px; border-radius: 12px; cursor: pointer; font-weight: bold; backdrop-filter: blur(5px); transition: all 0.3s;
        }
        .btn-toggle-voice:hover { background: var(--neon-blue); color: #000; }
        
        .voice-monitor-window {
            position: absolute; top: 50px; right: 0; width: 300px;
            background: rgba(10, 10, 15, 0.9); border: 1px solid var(--neon-blue); border-radius: 15px;
            padding: 15px; display: none; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .voice-monitor-window.show { display: flex; animation: fadeIn 0.3s ease; }
        .voice-monitor-title { font-size: 0.8rem; color: var(--neon-blue); margin-bottom: 10px; border-bottom: 1px solid rgba(0,229,255,0.3); padding-bottom: 5px; }
        .voice-transcript { font-size: 1rem; color: #fff; font-style: italic; min-height: 40px; word-wrap: break-word;}

        .feedback-badge {
            position: absolute; left: 50%; top: 40px; transform: translateX(-50%) scale(0.5);
            font-size: 2.5rem; font-weight: 900; opacity: 0; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase; text-shadow: 0 0 20px currentColor; pointer-events: none;
        }
        .feedback-badge.show { opacity: 1; transform: translateX(-50%) scale(1); }
        .feedback-badge.perfect { color: var(--gold); }
        .feedback-badge.good { color: var(--neon-blue); }

        /* Letras - Estilo Karaoke 3 Líneas */
        .lyrics-viewport {
            flex-grow: 1; position: relative; overflow: hidden; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
        }
        
        .lyrics-scroller {
            position: absolute; top: 50%; width: 100%; transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            display: flex; flex-direction: column; align-items: center; gap: 30px;
        }

        .lyric-line {
            font-size: 2.5rem; font-weight: 800; color: #fff; text-align: center;
            transition: all 0.4s ease; max-width: 90%; white-space: pre-wrap; line-height: 1.5;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            
            /* Estado por defecto (Oculto) */
            opacity: 0;
            transform: scale(0.8);
        }

        /* Línea Anterior (Arriba, opaca y un poco más pequeña) */
        .lyric-line.past {
            opacity: 0.3; transform: scale(0.9);
        }

        /* Línea Actual (Centro, gigante, brillante) */
        .lyric-line.active {
            opacity: 1; transform: scale(1.3); text-shadow: 0 0 20px rgba(255,255,255,0.4);
        }

        /* Línea Siguiente (Abajo, opaca y un poco más pequeña) */
        .lyric-line.upcoming {
            opacity: 0.3; transform: scale(0.9);
        }

        /* Palabras y relleno (Wipe effect) */
        .karaoke-word {
            display: inline-block; position: relative; margin-right: 8px;
            color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        .karaoke-word-fill {
            position: absolute; top: 0; left: 0; overflow: hidden; white-space: nowrap; width: 0%;
            color: var(--neon-blue); text-shadow: 0 0 15px var(--neon-blue); transition: width 0.1s linear;
        }

        .karaoke-word.voice-matched .karaoke-word-fill { color: var(--gold); text-shadow: 0 0 20px var(--gold); }
        .karaoke-word.voice-matched { transform: translateY(-5px); transition: transform 0.2s; }

        /* Controles Inferiores */
        .controls { display: flex; justify-content: center; gap: 20px; padding: 20px; z-index: 10;}
        
        .btn-control {
            background: rgba(0,0,0,0.6); padding: 15px 30px; border-radius: 10px;
            font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 1.1rem; border: 2px solid transparent; color: #fff;
        }
        
        .btn-pause { border-color: var(--neon-blue); color: var(--neon-blue); }
        .btn-pause:hover { background: var(--neon-blue); color: #000; box-shadow: 0 0 20px var(--neon-blue); }
        
        .btn-stop { border-color: #ff0055; color: #ff0055; }
        .btn-stop:hover { background: #ff0055; color: #fff; box-shadow: 0 0 20px #ff0055; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <!-- PANTALLA INICIO -->
    <div id="home-screen" class="screen active">
        <h1 class="title">Neon Voice Pro</h1>
        <div class="input-box">
            <div class="input-group">
                <input type="text" id="url-input" placeholder="🔗 Pega el link de YouTube aquí..." autocomplete="off">
            </div>
            <button id="start-btn" class="btn-start">🎤 Iniciar Karaoke Automático</button>
            <div id="setup-msg" class="status-msg"></div>
        </div>
    </div>

    <!-- PANTALLA KARAOKE -->
    <div id="karaoke-screen" class="screen">
        <div class="video-bg"><div id="youtube-player"></div></div>
        <div class="overlay"></div>

        <div class="karaoke-container">
            <div class="top-bar">
                <div class="score-board">
                    <div class="score-title">PUNTOS</div>
                    <div class="score-number" id="score-display">0</div>
                </div>
                
                <div id="feedback-badge" class="feedback-badge">¡PERFECTO!</div>
                
                <div class="voice-monitor-container">
                    <button id="btn-toggle-voice" class="btn-toggle-voice">🎙️ Monitor Voz</button>
                    <div id="voice-monitor-window" class="voice-monitor-window">
                        <div class="voice-monitor-title">Lo que el micrófono escucha:</div>
                        <div id="voice-transcript" class="voice-transcript">Esperando voz...</div>
                    </div>
                </div>
            </div>

            <div class="lyrics-viewport">
                <div class="lyrics-scroller" id="lyrics-scroller">
                    <!-- Las letras se inyectarán aquí -->
                </div>
            </div>

            <div class="controls">
                <button id="pause-btn" class="btn-control btn-pause">⏸️ Pausar</button>
                <button id="stop-btn" class="btn-control btn-stop">⏹️ Terminar</button>
            </div>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    
    <script>
        // --- ESTADO GLOBAL ---
        let player, recognition;
        let score = 0;
        let isPlaying = false;
        let parsedLyrics = []; 
        let activeLineIndex = -1;
        let animationFrameId;

        // --- DOM ---
        const ui = {
            home: document.getElementById('home-screen'), karaoke: document.getElementById('karaoke-screen'),
            url: document.getElementById('url-input'), startBtn: document.getElementById('start-btn'),
            pauseBtn: document.getElementById('pause-btn'), stopBtn: document.getElementById('stop-btn'), 
            msg: document.getElementById('setup-msg'), scroller: document.getElementById('lyrics-scroller'), 
            score: document.getElementById('score-display'), badge: document.getElementById('feedback-badge'),
            btnToggleVoice: document.getElementById('btn-toggle-voice'),
            voiceWindow: document.getElementById('voice-monitor-window'),
            voiceTranscript: document.getElementById('voice-transcript')
        };

        // --- CONTROLES DE INTERFAZ ---
        ui.btnToggleVoice.addEventListener('click', () => { ui.voiceWindow.classList.toggle('show'); });

        ui.pauseBtn.addEventListener('click', () => {
            if (!player) return;
            const state = player.getPlayerState();
            if (state === YT.PlayerState.PLAYING) {
                player.pauseVideo();
            } else if (state === YT.PlayerState.PAUSED) {
                player.playVideo();
            }
        });

        // --- 1. EXTRACCIÓN Y BÚSQUEDA ---
        ui.url.addEventListener('input', () => {
            const url = ui.url.value.trim();
            if(extractVideoID(url)) {
                ui.msg.style.color = "var(--neon-blue)";
                ui.msg.innerText = "🔍 Analizando el título original del video...";
                fetchVideoTitle(url);
            }
        });

        function extractVideoID(url) {
            const match = url.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        async function fetchVideoTitle(url) {
            try {
                const res = await fetch(`https://noembed.com/embed?url=${encodeURIComponent(url)}`);
                const data = await res.json();
                if (data.title) {
                    ui.msg.innerText = "✅ Título procesado. Listo para buscar.";
                    ui.url.dataset.title = data.title;
                }
            } catch (e) {
                ui.msg.innerText = "Listo para iniciar (Modo de búsqueda de respaldo).";
            }
        }

        // --- MOTOR DE BÚSQUEDA MULTI-FASE ---
        async function fetchLyricsWithRetry(originalTitle) {
            ui.scroller.innerHTML = "<div class='lyric-line active'>Buscando letras sincronizadas... ⏳</div>";
            parsedLyrics = [];
            
            let cleanTitle = originalTitle.replace(/\[.*?\]|\(.*?\)|【.*?】|「.*?」/g, ' ').trim();
            cleanTitle = cleanTitle.replace(/(official|music|video|lyric|lyrics|audio|hd|4k|hq|remix)/gi, ' ').trim();

            let artist = ""; let track = "";

            if (cleanTitle.includes('-')) {
                const parts = cleanTitle.split('-');
                artist = parts[0].trim(); track = parts.slice(1).join('-').trim();
            } else if (cleanTitle.includes('|')) {
                const parts = cleanTitle.split('|');
                artist = parts[0].trim(); track = parts.slice(1).join('|').trim();
            } else { track = cleanTitle; }

            if (artist) artist = artist.split(/ x | & | y |, | ft\. | feat\. /i)[0].trim();
            track = track.replace(/["']/g, "").trim();

            const normalizeStr = (s) => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
            const searchUrls = [];
            
            if (artist && track) {
                searchUrls.push(`https://lrclib.net/api/search?q=${encodeURIComponent(track + " " + artist)}`);
                searchUrls.push(`https://lrclib.net/api/search?q=${encodeURIComponent(normalizeStr(track) + " " + normalizeStr(artist))}`);
                searchUrls.push(`https://lrclib.net/api/search?track_name=${encodeURIComponent(track)}&artist_name=${encodeURIComponent(artist)}`);
            }
            searchUrls.push(`https://lrclib.net/api/search?q=${encodeURIComponent(cleanTitle)}`);
            if (track) searchUrls.push(`https://lrclib.net/api/search?q=${encodeURIComponent(track)}`);

            let match = null;
            for (let i = 0; i < searchUrls.length; i++) {
                try {
                    const res = await fetch(searchUrls[i]);
                    const data = await res.json();
                    if (data && data.length > 0) {
                        const lrcMatch = data.find(song => song.syncedLyrics);
                        if (lrcMatch) { match = lrcMatch; break; } 
                        else if (!match && data[0].plainLyrics) { match = data[0]; }
                    }
                } catch (e) {}
            }

            if (match && match.syncedLyrics) {
                parseLRC(match.syncedLyrics);
                renderLyrics();
                return true;
            } else if (match && match.plainLyrics) {
                ui.scroller.innerHTML = `<div class='lyric-line active' style='font-size: 1.5rem; line-height: 2;'>${match.plainLyrics}</div>`;
                return false;
            } else {
                ui.scroller.innerHTML = "<div class='lyric-line active'>Letra no encontrada en la base mundial. ❌<br><br>¡Canta con el alma! El sistema sumará puntos por tu fluidez vocal. 🎤</div>";
                return false;
            }
        }

        // --- 2. PARSEO LRC Y CÁLCULO DE TIEMPOS ---
        function parseLRC(lrcString) {
            const lines = lrcString.split('\n');
            const regex = /\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/;
            let tempLines = [];
            
            lines.forEach(line => {
                const match = line.match(regex);
                if (match) {
                    const min = parseInt(match[1]);
                    const sec = parseInt(match[2]);
                    const ms = parseInt(match[3].padEnd(3, '0'));
                    const time = (min * 60) + sec + (ms / 1000);
                    const text = match[4].trim();
                    
                    if (text) {
                        const wordsArr = text.split(/\s+/).map(w => ({
                            original: w, clean: normalize(w), matched: false, startTime: 0, endTime: 0 
                        }));
                        tempLines.push({ time, text, words: wordsArr });
                    }
                }
            });

            // Estimar duración de cada palabra para el llenado de color (wipe)
            for (let i = 0; i < tempLines.length; i++) {
                const currentLine = tempLines[i];
                const nextLineTime = (i + 1 < tempLines.length) ? tempLines[i+1].time : currentLine.time + 5; 
                
                const lineDuration = nextLineTime - currentLine.time;
                const activeDuration = Math.min(lineDuration, currentLine.words.length * 0.5); 
                const timePerWord = activeDuration / currentLine.words.length;

                currentLine.words.forEach((w, wIdx) => {
                    w.startTime = currentLine.time + (wIdx * timePerWord);
                    w.endTime = w.startTime + timePerWord;
                });
                
                parsedLyrics.push(currentLine);
            }
        }

        function normalize(str) {
            return str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "");
        }

        // --- 3. RENDERIZADO VISUAL 3 LÍNEAS ---
        function renderLyrics() {
            ui.scroller.innerHTML = "";
            parsedLyrics.forEach((line, i) => {
                const div = document.createElement('div');
                div.className = 'lyric-line'; // Inician invisibles
                div.id = `line-${i}`;
                
                line.words.forEach((w, wordIndex) => {
                    const spanWrap = document.createElement('span');
                    spanWrap.className = 'karaoke-word';
                    spanWrap.id = `word-wrap-${i}-${wordIndex}`;
                    spanWrap.innerText = w.original;
                    
                    const spanFill = document.createElement('span');
                    spanFill.className = 'karaoke-word-fill';
                    spanFill.id = `word-fill-${i}-${wordIndex}`;
                    spanFill.innerText = w.original; 
                    
                    spanWrap.appendChild(spanFill);
                    div.appendChild(spanWrap);
                });
                ui.scroller.appendChild(div);
            });
        }

        function syncLoop() {
            if (!isPlaying || !player || typeof player.getCurrentTime !== 'function') return;
            
            const currentTime = player.getCurrentTime();
            let newActiveIndex = -1;

            // Encontrar línea activa
            for (let i = parsedLyrics.length - 1; i >= 0; i--) {
                if (currentTime >= parsedLyrics[i].time - 0.3) {
                    newActiveIndex = i;
                    break;
                }
            }

            // Si cambió la línea
            if (newActiveIndex !== activeLineIndex && newActiveIndex !== -1) {
                if(activeLineIndex !== -1) evaluateLineCompletion(activeLineIndex);

                activeLineIndex = newActiveIndex;
                
                // Actualizar las clases para mostrar solo 3 líneas (Pasada, Actual, Siguiente)
                const allLines = document.querySelectorAll('.lyric-line');
                allLines.forEach((el, index) => {
                    el.className = 'lyric-line'; // Reset a oculto
                    if (index === activeLineIndex) {
                        el.classList.add('active');
                    } else if (index === activeLineIndex - 1) {
                        el.classList.add('past');
                    } else if (index === activeLineIndex + 1) {
                        el.classList.add('upcoming');
                    }
                });

                // Centrar la pantalla basándose en el elemento activo
                const activeEl = document.getElementById(`line-${activeLineIndex}`);
                if (activeEl) {
                    const offset = activeEl.offsetTop - (ui.scroller.parentElement.offsetHeight / 2) + (activeEl.offsetHeight / 2);
                    ui.scroller.style.transform = `translateY(-${Math.max(0, offset)}px)`;
                }
            }

            // Animar el color de las palabras (Wipe effect)
            if (activeLineIndex !== -1) {
                const line = parsedLyrics[activeLineIndex];
                line.words.forEach((w, wIdx) => {
                    const fillEl = document.getElementById(`word-fill-${activeLineIndex}-${wIdx}`);
                    if (fillEl) {
                        if (currentTime >= w.endTime) {
                            fillEl.style.width = '100%';
                        } else if (currentTime >= w.startTime && currentTime < w.endTime) {
                            const percent = ((currentTime - w.startTime) / (w.endTime - w.startTime)) * 100;
                            fillEl.style.width = `${percent}%`;
                        } else {
                            fillEl.style.width = '0%';
                        }
                    }
                });
            }

            animationFrameId = requestAnimationFrame(syncLoop);
        }

        // --- 4. RECONOCIMIENTO DE VOZ Y EVALUACIÓN ---
        function setupSpeech() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) { alert("Navegador no compatible. Usa Google Chrome o Edge."); return false; }

            recognition = new SR();
            recognition.continuous = true; recognition.interimResults = true; recognition.lang = 'es-ES';

            recognition.onresult = (e) => {
                let interim = ""; let final = "";
                for (let i = e.resultIndex; i < e.results.length; ++i) {
                    if(e.results[i].isFinal) final += e.results[i][0].transcript + " ";
                    else interim += e.results[i][0].transcript + " ";
                }
                
                ui.voiceTranscript.innerText = final || interim;
                checkVoiceMatch((final || interim).trim());
            };
            
            recognition.onend = () => { if (isPlaying) recognition.start(); };
            return true;
        }

        function checkVoiceMatch(spokenText) {
            if (parsedLyrics.length === 0) {
                if (spokenText.length > 5) { score += 5; ui.score.innerText = score; }
                return;
            }

            if (activeLineIndex === -1) return;
            const spokenWords = spokenText.split(/\s+/).map(w => normalize(w));
            
            [activeLineIndex, activeLineIndex - 1].forEach(lineIdx => {
                if (lineIdx < 0) return;
                
                const line = parsedLyrics[lineIdx];
                line.words.forEach((lineWord, wIdx) => {
                    if (!lineWord.matched && lineWord.clean.length > 2 && spokenWords.some(sw => sw.includes(lineWord.clean))) {
                        lineWord.matched = true;
                        score += 20;
                        ui.score.innerText = score;
                        
                        const wordWrapEl = document.getElementById(`word-wrap-${lineIdx}-${wIdx}`);
                        if (wordWrapEl) wordWrapEl.classList.add('voice-matched');
                    }
                });
            });
        }

        function evaluateLineCompletion(lineIdx) {
            const line = parsedLyrics[lineIdx];
            const evaluableWords = line.words.filter(w => w.clean.length > 2);
            if (evaluableWords.length === 0) return;

            const matchedWords = evaluableWords.filter(w => w.matched).length;
            const percentage = matchedWords / evaluableWords.length;

            if (percentage >= 0.8) { showBadge("¡PERFECTO! 🔥", 'perfect', 50); } 
            else if (percentage >= 0.4) { showBadge("¡BIEN! 👍", 'good', 10); }
        }

        function showBadge(text, className, bonus) {
            ui.badge.className = 'feedback-badge'; 
            ui.badge.innerText = text;
            ui.badge.classList.add(className);
            
            score += bonus;
            ui.score.innerText = score;
            ui.badge.classList.add('show');
            setTimeout(() => ui.badge.classList.remove('show'), 1500);
        }

        // --- 5. YOUTUBE API Y SINCRONIZADOR GLOBAL ---
        function onYouTubeIframeAPIReady() {}
        function initYouTube(videoId) {
            if (player) { player.loadVideoById(videoId); } 
            else {
                player = new YT.Player('youtube-player', {
                    videoId: videoId,
                    playerVars: { 'autoplay': 1, 'controls': 0, 'disablekb': 1, 'modestbranding': 1 },
                    events: { 'onStateChange': (e) => {
                        if (e.data === YT.PlayerState.PLAYING) {
                            ui.pauseBtn.innerText = "⏸️ Pausar";
                            if (!isPlaying) {
                                isPlaying = true;
                                try { recognition.start(); } catch(e){}
                                syncLoop();
                            }
                        }
                        else if (e.data === YT.PlayerState.PAUSED) {
                            isPlaying = false;
                            ui.pauseBtn.innerText = "▶️ Reanudar";
                            cancelAnimationFrame(animationFrameId);
                            if (recognition) recognition.stop();
                        }
                        else if (e.data === YT.PlayerState.ENDED) {
                            isPlaying = false;
                            cancelAnimationFrame(animationFrameId);
                            if (recognition) recognition.stop();
                        }
                    }}
                });
            }
        }

        // --- 6. INICIO Y FIN ---
        ui.startBtn.addEventListener('click', async () => {
            const vId = extractVideoID(ui.url.value);
            if (!vId) { ui.msg.style.color = "red"; ui.msg.innerText = "❌ URL inválida."; return; }

            const queryTitle = ui.url.dataset.title || "Unknown"; 

            ui.msg.innerText = "Autorizando micrófono... 🎙️";
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                stream.getTracks().forEach(t => t.stop());
                
                if (!setupSpeech()) return;

                ui.home.classList.remove('active');
                ui.karaoke.classList.add('active');
                
                score = 0; ui.score.innerText = score;
                activeLineIndex = -1;
                ui.scroller.style.transform = `translateY(0)`;
                ui.voiceTranscript.innerText = "Esperando voz...";
                ui.pauseBtn.innerText = "⏸️ Pausar";
                
                initYouTube(vId);
                fetchLyricsWithRetry(queryTitle);

            } catch (err) { ui.msg.style.color = "red"; ui.msg.innerText = "❌ Permite el micrófono."; }
        });

        ui.stopBtn.addEventListener('click', () => {
            isPlaying = false;
            cancelAnimationFrame(animationFrameId);
            if (recognition) recognition.stop();
            if (player?.stopVideo) player.stopVideo();
            
            alert(`🎤 ¡Sesión terminada!\nPuntuación total: ${score}`);
            ui.karaoke.classList.remove('active');
            ui.home.classList.add('active');
            ui.url.value = "";
            ui.msg.innerText = "";
            ui.voiceWindow.classList.remove('show');
        });
    </script>
</body>
</html>
