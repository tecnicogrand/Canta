<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Voice Karaoke - Immersive</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #090a0f;
            --neon-blue: #00f3ff;
            --neon-pink: #ff00ea;
            --text-light: #e0e0e0;
            --panel-bg: rgba(15, 15, 20, 0.65);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            overflow: hidden; /* Evitar scroll en toda la página */
        }

        /* --- PANTALLAS --- */
        .screen {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0; left: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .screen.active {
            display: flex;
            animation: fadeIn 0.6s ease-out;
        }

        /* --- PANTALLA DE INICIO --- */
        #home-screen {
            background-image: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #090a0f 100%);
        }

        h1.title {
            font-size: 4rem;
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--neon-blue), 0 0 20px var(--neon-blue), 0 0 40px var(--neon-pink);
            margin-bottom: 10px;
            text-align: center;
        }
        
        .subtitle {
            color: var(--neon-blue);
            margin-bottom: 40px;
            text-align: center;
            font-weight: 400;
        }

        .input-box {
            background: rgba(20, 20, 30, 0.8);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(0, 243, 255, 0.2);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.1);
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            backdrop-filter: blur(10px);
        }

        input {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #2a2a35;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            font-size: 1.1rem;
            outline: none;
            transition: all 0.3s;
        }

        input:focus {
            border-color: var(--neon-pink);
            box-shadow: 0 0 15px rgba(255, 0, 234, 0.4);
        }

        .helper-text { font-size: 0.85rem; color: #888; margin-top: -10px; }

        button {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
            color: #fff;
        }

        .btn-start {
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-pink));
            box-shadow: 0 0 20px rgba(255, 0, 234, 0.5);
        }

        .btn-start:hover { transform: scale(1.05); box-shadow: 0 0 40px rgba(0, 243, 255, 0.8); }
        .status-msg { margin-top: 5px; color: #ffeb3b; text-align: center; height: 20px; font-weight: bold;}

        /* --- PANTALLA DE KARAOKE (IMMERSIVE) --- */
        
        /* Video de Fondo */
        .video-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 1;
            pointer-events: none; /* El usuario no puede hacer click al video */
            overflow: hidden;
            background: #000;
        }

        /* Truco para que el iframe actúe como "object-fit: cover" */
        .video-bg iframe {
            width: 100vw;
            height: 56.25vw; /* 16:9 ratio */
            min-height: 100vh;
            min-width: 177.77vh; /* 16:9 ratio */
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.7; /* Ligeramente opaco para leer las letras */
        }

        /* Capa oscura sobre el video para resaltar UI */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2;
        }

        /* Contenedor de la interfaz de karaoke */
        .karaoke-ui {
            position: relative;
            z-index: 3;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        /* Barra Superior: Puntos y Monitor de Voz */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
        }

        .score-board {
            background: var(--panel-bg);
            padding: 10px 20px;
            border-radius: 15px;
            border: 1px solid var(--neon-pink);
            backdrop-filter: blur(5px);
            text-align: center;
        }
        .score-title { font-size: 0.9rem; color: #ccc; }
        .score-number {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--neon-pink);
            text-shadow: 0 0 15px var(--neon-pink);
            transition: transform 0.2s;
        }

        /* Monitor de Voz (Ventana Pequeña) */
        .voice-monitor {
            background: var(--panel-bg);
            border: 1px solid var(--neon-blue);
            border-radius: 15px;
            backdrop-filter: blur(5px);
            width: 300px;
            transition: all 0.3s ease;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }
        
        .voice-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: rgba(0, 243, 255, 0.1);
            border-bottom: 1px solid rgba(0, 243, 255, 0.2);
        }
        .voice-header span { font-size: 0.9rem; font-weight: bold; color: var(--neon-blue); }
        .toggle-btn {
            background: transparent; border: none; color: #fff; 
            padding: 0; font-size: 1.2rem; cursor: pointer;
        }

        .voice-content {
            padding: 15px;
            font-size: 1rem;
            color: #fff;
            min-height: 60px;
            text-align: center;
            font-style: italic;
        }

        .voice-monitor.minimized .voice-content { display: none; }

        /* Letras Centrales */
        .lyrics-center {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .lyrics-title {
            color: var(--neon-blue);
            font-size: 1.5rem;
            margin-bottom: 15px;
            text-shadow: 0 0 10px var(--neon-blue);
            text-align: center;
            background: rgba(0,0,0,0.5);
            padding: 5px 15px;
            border-radius: 10px;
        }

        .lyrics-box {
            width: 100%;
            max-width: 800px;
            height: 55vh;
            overflow-y: auto;
            text-align: center;
            font-size: 1.8rem;
            line-height: 1.8;
            padding: 20px;
            white-space: pre-wrap;
            color: #fff;
            font-weight: 700;
            text-shadow: 2px 2px 4px #000, 0 0 10px rgba(255,255,255,0.5);
            /* Scroll snap effect optional */
        }

        /* Scrollbar Neón */
        .lyrics-box::-webkit-scrollbar { width: 8px; }
        .lyrics-box::-webkit-scrollbar-thumb { background: var(--neon-pink); border-radius: 4px; }
        .lyrics-box::-webkit-scrollbar-track { background: rgba(255,255,255,0.1); border-radius: 4px;}

        /* Botón Inferior */
        .bottom-bar {
            text-align: center;
            padding-bottom: 10px;
        }

        .btn-stop {
            background: rgba(255, 0, 60, 0.2);
            border: 2px solid #ff003c;
            color: #fff;
            backdrop-filter: blur(5px);
        }
        .btn-stop:hover {
            background: #ff003c;
            box-shadow: 0 0 30px #ff003c;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- PANTALLA DE INICIO -->
    <div id="home-screen" class="screen active">
        <h1 class="title">Neon Voice</h1>
        <p class="subtitle">Experiencia de Karaoke Inmersiva</p>

        <div class="input-box">
            <div>
                <input type="text" id="url-input" placeholder="URL de YouTube (Obligatorio)*">
                <p class="helper-text">Ej: https://www.youtube.com/watch?v=...</p>
            </div>
            
            <div>
                <!-- Campo combinado para ahorrar espacio -->
                <input type="text" id="search-input" placeholder="Artista - Canción (Opcional)">
                <p class="helper-text">Ej: Coldplay - Yellow (Separa con un guión para buscar la letra)</p>
            </div>

            <button id="start-btn" class="btn-start">🎤 Iniciar Sesión</button>
            <div id="setup-msg" class="status-msg"></div>
        </div>
    </div>

    <!-- PANTALLA DE KARAOKE -->
    <div id="karaoke-screen" class="screen">
        
        <!-- Video Fondo -->
        <div class="video-bg">
            <div id="youtube-player"></div>
        </div>
        <!-- Filtro Oscuro -->
        <div class="overlay"></div>

        <!-- Interfaz Superior -->
        <div class="karaoke-ui">
            <div class="top-bar">
                <!-- Puntuación -->
                <div class="score-board">
                    <div class="score-title">PUNTOS</div>
                    <div class="score-number" id="score-display">0</div>
                </div>

                <!-- Monitor de Voz (Ventana minimizable) -->
                <div class="voice-monitor" id="voice-window">
                    <div class="voice-header">
                        <span>🎙️ Monitor de Voz</span>
                        <button class="toggle-btn" id="toggle-voice-btn">➖</button>
                    </div>
                    <div class="voice-content" id="voice-feedback">
                        Esperando que cantes...
                    </div>
                </div>
            </div>

            <!-- Letras en el Centro -->
            <div class="lyrics-center">
                <div class="lyrics-title" id="lyrics-title">Modo Libre</div>
                <div class="lyrics-box" id="lyrics-box">
                    Las letras aparecerán aquí...
                </div>
            </div>

            <!-- Botón Salir -->
            <div class="bottom-bar">
                <button id="stop-btn" class="btn-stop">Terminar Presentación</button>
            </div>
        </div>

    </div>

    <!-- Script de la API de YouTube -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <!-- Lógica Principal -->
    <script>
        // --- VARIABLES GLOBALES ---
        let player;
        let recognition;
        let score = 0;
        let isPlaying = false;
        let lyricsWordsSet = new Set(); 

        // --- ELEMENTOS DEL DOM ---
        const homeScreen = document.getElementById('home-screen');
        const karaokeScreen = document.getElementById('karaoke-screen');
        const urlInput = document.getElementById('url-input');
        const searchInput = document.getElementById('search-input');
        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');
        const scoreDisplay = document.getElementById('score-display');
        const voiceFeedback = document.getElementById('voice-feedback');
        const voiceWindow = document.getElementById('voice-window');
        const toggleVoiceBtn = document.getElementById('toggle-voice-btn');
        const lyricsBox = document.getElementById('lyrics-box');
        const lyricsTitle = document.getElementById('lyrics-title');
        const setupMsg = document.getElementById('setup-msg');

        // --- UTILIDADES ---
        function extractVideoID(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function normalizeText(text) {
            return text.toLowerCase()
                       .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                       .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()'"?¿¡!]/g,"")
                       .trim();
        }

        // --- LÓGICA DE INTERFAZ (UI) ---
        toggleVoiceBtn.addEventListener('click', () => {
            voiceWindow.classList.toggle('minimized');
            toggleVoiceBtn.innerText = voiceWindow.classList.contains('minimized') ? '➕' : '➖';
        });

        // --- YOUTUBE API ---
        function onYouTubeIframeAPIReady() {
            console.log("YT API lista");
        }

        function initYouTube(videoId) {
            if (player) {
                player.loadVideoById(videoId);
            } else {
                player = new YT.Player('youtube-player', {
                    videoId: videoId,
                    playerVars: { 
                        'autoplay': 1, 
                        'controls': 0, // Ocultar controles de YT para mayor inmersión
                        'disablekb': 1,
                        'modestbranding': 1,
                        'rel': 0
                    },
                    events: { 'onStateChange': onPlayerStateChange }
                });
            }
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                if (!isPlaying) startRecognition();
            } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
                stopRecognition();
            }
        }

        // --- RECONOCIMIENTO DE VOZ ---
        function setupSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                alert("Tu navegador no soporta el reconocimiento de voz. Por favor usa Chrome o Edge.");
                return false;
            }

            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'es-ES';

            recognition.onstart = function() {
                isPlaying = true;
                voiceFeedback.innerHTML = "Escuchando... 🎵";
                voiceFeedback.style.color = "var(--neon-pink)";
            };

            recognition.onresult = function(event) {
                let interimTranscript = '';
                let finalTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                        evaluateSpeech(event.results[i][0].transcript);
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }

                if (interimTranscript !== '') {
                    voiceFeedback.innerHTML = interimTranscript;
                } else if (finalTranscript !== '') {
                    voiceFeedback.innerHTML = finalTranscript;
                    setTimeout(() => { if(isPlaying) voiceFeedback.innerHTML = "Escuchando... 🎵"; }, 2000);
                }
            };

            recognition.onerror = function(event) {
                if (event.error === 'not-allowed') alert("Debes permitir el uso del micrófono.");
            };

            recognition.onend = function() {
                if (isPlaying && player && player.getPlayerState() === YT.PlayerState.PLAYING) {
                    recognition.start();
                }
            };

            return true;
        }

        function startRecognition() {
            if (recognition && !isPlaying) {
                try { recognition.start(); } catch(e){}
            }
        }

        function stopRecognition() {
            isPlaying = false;
            if (recognition) {
                recognition.stop();
                voiceFeedback.innerHTML = "Pausado ⏸️";
                voiceFeedback.style.color = "#ccc";
            }
        }

        // --- PUNTUACIÓN Y LETRAS ---
        async function fetchLyrics(query) {
            lyricsWordsSet.clear();
            
            if (!query || !query.includes('-')) {
                lyricsTitle.innerText = query ? `Buscando: ${query}` : "Modo Libre";
                lyricsBox.innerHTML = "Para buscar letras oficiales, asegúrate de escribir: Artista - Canción.<br><br>¡El sistema seguirá puntuando tu fluidez vocal de todos modos!";
                return;
            }

            // Separar Artista y Canción
            const parts = query.split('-');
            const artist = parts[0].trim();
            const song = parts.slice(1).join('-').trim(); // Por si la canción tiene guiones

            lyricsTitle.innerText = `${song} - ${artist}`;
            lyricsBox.innerHTML = "Buscando letra en la base de datos... ⏳";

            try {
                // Usamos la API pública y gratuita lyrics.ovh
                const res = await fetch(`https://api.lyrics.ovh/v1/${encodeURIComponent(artist)}/${encodeURIComponent(song)}`);
                const data = await res.json();

                if (data.lyrics) {
                    const cleanLyrics = data.lyrics.replace(/\n\n\n/g, '\n\n');
                    lyricsBox.innerText = cleanLyrics;
                    
                    const normalizedLyrics = normalizeText(cleanLyrics);
                    const wordsArray = normalizedLyrics.split(/\s+/);
                    
                    wordsArray.forEach(word => {
                        if (word.length > 3) lyricsWordsSet.add(word);
                    });
                } else {
                    throw new Error("No encontrada");
                }
            } catch (err) {
                lyricsBox.innerHTML = "No se encontró la letra exacta. ❌<br><br>¡Canta con el alma! El sistema puntuará tu fluidez.";
            }
        }

        function evaluateSpeech(spokenText) {
            const spokenWords = normalizeText(spokenText).split(/\s+/);
            let matchCount = 0;

            spokenWords.forEach(word => {
                if (word.length > 3 && lyricsWordsSet.has(word)) {
                    matchCount++;
                    score += 50;
                } else if (lyricsWordsSet.size === 0 && word.length > 2) {
                    score += 10; // Puntos genéricos si no hay letra
                }
            });

            if (matchCount > 0 || lyricsWordsSet.size === 0) {
                scoreDisplay.innerText = score;
                scoreDisplay.style.transform = 'scale(1.3)';
                setTimeout(() => scoreDisplay.style.transform = 'scale(1)', 150);
            }
        }

        // --- INICIAR / DETENER ---
        startBtn.addEventListener('click', async () => {
            const url = urlInput.value.trim();
            const searchQuery = searchInput.value.trim();
            const videoId = extractVideoID(url);

            if (!videoId) {
                setupMsg.innerText = "❌ URL de YouTube no válida.";
                return;
            }

            setupMsg.innerText = "Autorizando micrófono... 🎙️";
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                stream.getTracks().forEach(track => track.stop());
                
                if (!setupSpeechRecognition()) return;

                homeScreen.classList.remove('active');
                karaokeScreen.classList.add('active');
                
                score = 0;
                scoreDisplay.innerText = score;
                
                initYouTube(videoId);
                fetchLyrics(searchQuery);

            } catch (err) {
                setupMsg.innerText = "❌ Necesitas dar permisos de micrófono.";
            }
        });

        stopBtn.addEventListener('click', () => {
            stopRecognition();
            if (player && typeof player.stopVideo === 'function') {
                player.stopVideo();
            }
            alert(`🎤 ¡Presentación terminada!\nPuntuación final: ${score} puntos`);
            
            karaokeScreen.classList.remove('active');
            homeScreen.classList.add('active');
            setupMsg.innerText = "";
        });
    </script>
</body>
</html>
